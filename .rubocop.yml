inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

# Shared house cops. Canonical copy lives in claude/defaults; this one is a
# duplicate because a plugin has to resolve inside CI's own checkout.
require:
  - ./rubocop/comment_density_cops.rb

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    # Restore defaults (overridden when specifying custom excludes)
    - ".git/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    # Project-specific
    - "spec/grpc_smoke_spec.rb"

# Thresholds ship with the cops; only the excludes are ours. Generated protobuf
# is out of scope for all three — its comments are the generator's, not ours.
# The merge mode keeps this permanent exclusion from overwriting the temporary
# ones in .rubocop_todo.yml, which is a separate list with a separate lifetime.
House/FileCommentDensity: &house_density
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "lib/busybee/grpc/*_pb.rb"

House/HeaderCommentDensity: *house_density

House/InternalCommentDensity: *house_density

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/LineLength:
  Max: 120
  Exclude:
    - "lib/busybee/grpc/gateway_pb.rb"
    - "lib/busybee/grpc/gateway_services_pb.rb"

Lint/UselessDefaultValueArgument:
  Enabled: false

Metrics/AbcSize:
  Exclude:
    - "spec/demo/db/*_migrate/**/*"

Metrics/BlockLength:
  Exclude:
    - "Rakefile"
    - "lib/busybee/testing/matchers/**/*"

Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "spec/demo/db/*_migrate/**/*"

Metrics/ModuleLength:
  Max: 150

Naming/VariableNumber:
  Exclude:
    - "spec/**/*"

RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
    - "spec/**/matchers/**/*"
    - "spec/demo/spec/bpmn/**/*"

RSpec/ExampleLength:
  Max: 15
  Exclude:
    - "spec/integration/**/*"
    - "spec/demo/spec/bpmn/**/*"

RSpec/MessageSpies:
  EnforcedStyle: have_received

RSpec/MultipleExpectations:
  Max: 6

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/Output:
  # The demo app lives under spec/demo, so its app code (seeds, rake tasks)
  # writes to stdout legitimately and is not a spec suite.
  Exclude:
    - "spec/demo/**/*"

RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/integration/**/*"

Style/CaseEquality:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/EmptyClassDefinition:
  # Compact error/marker classes: Foo = Class.new(Error).
  EnforcedStyle: class_new

Style/ModuleFunction:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/RedundantStringEscape:
  Exclude:
    - "lib/busybee/grpc/gateway_pb.rb"

Style/SpecialGlobalVars:
  EnforcedStyle: use_perl_names

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: single_quotes
