default: &default
  adapter: sqlite3
  pool: 5
  timeout: 10000
  pragma:
    journal_mode: wal

# Monitoring is TimescaleDB (the compose `postgres` service). Its migrations are
# the schema's source: a schema dump can't carry hypertables or retention
# policies, so none is written and a fresh database is built by migrating.
monitoring: &monitoring
  adapter: postgresql
  pool: 5
  migrations_paths: db/monitoring_migrate
  schema_dump: false

# One database per domain. Each domain's workers, models, and migrations are
# self-contained (no cross-domain associations), so giving each its own SQLite
# file removes the single-writer contention of a shared database and more
# realistically models a distributed system. Monitoring is its own database too,
# so the observability sink never contends with business writes.
development:
  oms:
    <<: *default
    database: db/data/oms_development.sqlite3
    migrations_paths: db/oms_migrate
  logistics:
    <<: *default
    database: db/data/logistics_development.sqlite3
    migrations_paths: db/logistics_migrate
  delivery:
    <<: *default
    database: db/data/delivery_development.sqlite3
    migrations_paths: db/delivery_migrate
  monitoring:
    <<: *monitoring
    url: <%= ENV.fetch("MONITORING_DATABASE_URL", "postgres://postgres:postgres@localhost:55432/monitoring_development") %>

# seeds: false, so the spec boot's prepare_all creates a database without seeding
# it: specs build their own rows, and seeded ones would sit outside every
# example's transaction.
test:
  oms:
    <<: *default
    database: db/oms_test.sqlite3
    migrations_paths: db/oms_migrate
    seeds: false
  logistics:
    <<: *default
    database: db/logistics_test.sqlite3
    migrations_paths: db/logistics_migrate
    seeds: false
  delivery:
    <<: *default
    database: db/delivery_test.sqlite3
    migrations_paths: db/delivery_migrate
    seeds: false
  monitoring:
    <<: *monitoring
    url: <%= ENV.fetch("MONITORING_TEST_DATABASE_URL", "postgres://postgres:postgres@localhost:55432/monitoring_test") %>
    seeds: false
