# OMS domain workers — order lifecycle tracking.
#
# Simple transactional workers that update order status at each pipeline stage.
# No per-worker overrides needed; defaults work well for this domain.

workers:
  - Oms::LoadOrderAddressWorker
  - Oms::MarkOrderPreparedWorker
  - Oms::MarkOrderPackedWorker
  - Oms::MarkOrderShippingWorker
  - Oms::MarkOrderFulfilledWorker
